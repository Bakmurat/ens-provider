{{- $ns := .Values.namespace -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cluster-autoscaler
  namespace: {{ $ns }}
  labels: { app: cluster-autoscaler, autoscaler/component: ca-core }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ens-provider
  namespace: {{ $ns }}
  labels: { app: ens-provider, autoscaler/component: ca-provider }
{{- /* Static fallback pull secret(s) IN ADDITION to whatever a managed registry
credential helper patches in at runtime (helm list + helper patch coexist -
kubelet tries every listed secret). Used for a never-expiring
fixed-password registry credential (belt-and-braces). */}}
{{- with .Values.provider.extraImagePullSecrets }}
imagePullSecrets:
{{- range . }}
  - name: {{ . }}
{{- end }}
{{- end }}
---
# ---- Cluster Autoscaler core: canonical upstream permissions ----
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-autoscaler
  labels: { app: cluster-autoscaler }
rules:
  - apiGroups: [""]
    resources: ["events", "endpoints"]
    verbs: ["create", "patch"]
  - apiGroups: [""]
    resources: ["pods/eviction"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods/status"]
    verbs: ["update"]
  - apiGroups: [""]
    resources: ["endpoints"]
    resourceNames: ["cluster-autoscaler"]
    verbs: ["get", "update"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["watch", "list", "get", "update"]
  - apiGroups: [""]
    resources: ["namespaces", "pods", "services", "replicationcontrollers", "persistentvolumeclaims", "persistentvolumes"]
    verbs: ["watch", "list", "get"]
  - apiGroups: ["batch", "extensions"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["apps"]
    resources: ["statefulsets", "replicasets", "daemonsets"]
    verbs: ["watch", "list", "get"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["watch", "list"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses", "csinodes", "csidrivers", "csistoragecapacities", "volumeattachments"]
    verbs: ["watch", "list", "get"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["watch", "list", "get"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create"]
  - apiGroups: ["coordination.k8s.io"]
    resourceNames: ["cluster-autoscaler"]
    resources: ["leases"]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cluster-autoscaler
  namespace: {{ $ns }}
  labels: { app: cluster-autoscaler }
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["cluster-autoscaler-status"]
    verbs: ["delete", "get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-autoscaler
  labels: { app: cluster-autoscaler }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: cluster-autoscaler }
subjects:
  - { kind: ServiceAccount, name: cluster-autoscaler, namespace: {{ $ns }} }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cluster-autoscaler
  namespace: {{ $ns }}
  labels: { app: cluster-autoscaler }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: cluster-autoscaler }
subjects:
  - { kind: ServiceAccount, name: cluster-autoscaler, namespace: {{ $ns }} }
---
# ---- ENS provider: only nodes (providerID patch + drained-node cleanup) ----
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ens-provider
  labels: { app: ens-provider }
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch", "patch", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ens-provider
  labels: { app: ens-provider }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: ens-provider }
subjects:
  - { kind: ServiceAccount, name: ens-provider, namespace: {{ $ns }} }
{{- if .Values.provider.leaderElection.enabled }}
---
# ---- ENS provider HA : namespaced election + routing perms --------
# leases: `create` cannot be resourceName-scoped (same split the CA rules use);
# get/update are pinned to the constant lease. pods get/patch is the leader-
# label surface — Deployment pod names are dynamic, so resourceNames cannot
# pin them; namespace scope is the narrowest practical grant (the provider
# already holds far stronger CLUSTER-wide Node mutation authority above).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ens-provider-ha
  namespace: {{ $ns }}
  labels: { app: ens-provider }
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames: ["ens-provider-leader"]
    verbs: ["get", "update"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ens-provider-ha
  namespace: {{ $ns }}
  labels: { app: ens-provider }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: ens-provider-ha }
subjects:
  - { kind: ServiceAccount, name: ens-provider, namespace: {{ $ns }} }
{{- end }}
